name: nimbus_bank
description: "Nimbus — a modern neobank UI kit built with Flutter, Riverpod and Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.2.3

  # UI & typography
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
